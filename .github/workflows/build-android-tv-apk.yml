name: Build Android TV APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-android-tv-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-tv
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp android-tv/app/build/outputs/apk/debug/app-debug.apk TVUtility-AndroidTV-v1.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVUtility-AndroidTV-APK
          path: TVUtility-AndroidTV-v1.7.apk
          if-no-files-found: error
