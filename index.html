<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111e">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Xiaomi TV Home V6.2</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=6.2">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="shell" id="homeScreen">
    <header class="topbar">
      <div>
        <p class="eyebrow">XIAOMI ANDROID TV · HOME</p>
        <h1 id="greeting">TV Home</h1>
        <p id="today" class="muted">Đang tải ngày giờ…</p>
      </div>
      <div class="status-card">
        <div id="clock" class="clock">--:--</div>
        <div class="status-line"><span id="networkDot" class="dot"></span><span id="networkText">Đang kiểm tra mạng</span></div>
        <div id="gamepadStatus" class="device-line">🎮 Chưa thấy tay cầm</div>
      </div>
    </header>

    <section class="apps-section">
      <p class="eyebrow">CHỌN NỘI DUNG</p>
      <div class="app-grid">
        <button class="app-card app-tv focusable" data-app="tv">
          <span class="app-icon">📺</span>
          <span class="app-title">Xem TV</span>
          <span class="app-desc">Mở là phát VTV1 · chuyển VTV1–VTV9 ngay</span>
        </button>

        <button class="app-card app-youtube focusable" data-app="youtube">
          <span class="app-icon">▶️</span>
          <span class="app-title">YouTube</span>
          <span class="app-desc">Player YouTube ngay trong TV Home · nhớ video gần nhất</span>
        </button>

        <button class="app-card app-game focusable" data-app="game">
          <span class="app-icon">🎮</span>
          <span class="app-title">Game Center</span>
          <span class="app-desc">10 game · Logitech F710 / gamepad / remote / bàn phím</span>
        </button>
      </div>
    </section>

    <section class="system-strip">
      <button id="fullscreenBtn" class="sys-btn focusable">⛶ Toàn màn hình</button>
      <button id="wakeBtn" class="sys-btn focusable">☀ Giữ màn hình sáng <small id="wakeState">Tắt</small></button>
      <button id="reloadBtn" class="sys-btn focusable">↻ Tải lại</button>
    </section>

    <footer>
      <span>Xiaomi TV Home V6.2</span>
      <span>F710: D-pad/Analog · A chọn · B quay lại · Start tạm dừng game</span>
    </footer>
  </main>

  <section id="appPanel" class="app-panel" aria-hidden="true">
    <header class="panel-top">
      <button id="backBtn" class="back-btn focusable">← Quay lại</button>
      <div>
        <p class="eyebrow" id="panelEyebrow">ỨNG DỤNG</p>
        <h2 id="panelTitle">Xem TV</h2>
      </div>
      <div class="panel-clock" id="panelClock">--:--</div>
    </header>
    <div id="panelBody" class="panel-body"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="./app.js?v=6.2"></script>
  <script src="./media.js?v=6.2"></script>
  <script src="./games.js?v=6.2"></script>
</body>
</html>
